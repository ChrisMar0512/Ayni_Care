services:
  - type: web
    name: ayni-care-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --workspace=apps/backend
    startCommand: npm run start --workspace=apps/backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_TOKEN
        value: aynicare-admin-2026
