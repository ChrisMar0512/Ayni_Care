<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayni Care API</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F8FAF8;
      color: #1A2B1A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 1px solid #E2E8F0;
      max-width: 480px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #E8F5E9;
      color: #2D6A4F;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.6rem;
      color: #1B4332;
    }
    p {
      color: #4A5568;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    a {
      display: block;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #2D6A4F;
      color: white;
    }
    .btn-primary:hover {
      background: #1B4332;
    }
    .btn-secondary {
      background: #EDF2F7;
      color: #2D3748;
    }
    .btn-secondary:hover {
      background: #E2E8F0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● Servicio Activo</div>
    <h1>🌿 Ayni Care API</h1>
    <p>Servidor central de coordinación de cuidado familiar y backend de sincronización.</p>
    <div class="links">
      <a class="btn-primary" href="/admin/insights?token=aynicare-admin-2026">📊 Panel de Métricas de Negocio</a>
      <a class="btn-secondary" href="/health">🩺 Ver Estado del API (/health)</a>
    </div>
  </div>
</body>
</html>
